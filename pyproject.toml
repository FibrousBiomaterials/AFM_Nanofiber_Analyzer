# Packaging metadata for AFM Nanofiber Analyzer.
#
# Scope: `pip install` installs only the analysis package
# `afm_nanofiber_analyzer`, so it can be imported from any environment, such
# as a Jupyter notebook. The launcher (Main.py), the GUIs (guis/) and the CLI
# (cli.py) are not installed: they run from a checkout, where
# `pip install -e .` provides the declared dependencies. End-user distribution
# of the GUIs is the PyInstaller bundle produced by build.py (see README).
#
# `pip install` が入れるのは解析パッケージ `afm_nanofiber_analyzer` だけで、
# Jupyter notebook などどの環境からも import できる。ランチャー（Main.py）・
# GUI（guis/）・CLI（cli.py）はインストールせず、リポジトリから実行する。そこでは
# `pip install -e .` が宣言した依存を入れる。GUI のエンドユーザー向け配布は
# build.py が生成する PyInstaller バンドルである（README 参照）。

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "afm-nanofiber-analyzer"
version = "2.1.0.dev0"
description = "GUI toolkit and CLI for preprocessing AFM height images and analyzing nanofiber morphology"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Shingo Kiyoto" },
    { name = "Tomoki Ito" },
    { name = "Keita Mayumi" },
    { name = "Kayoko Kobayashi" },
]
keywords = [
    "AFM",
    "atomic force microscopy",
    "nanofiber",
    "image analysis",
    "skeletonization",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
# Loose runtime requirements; the verified snapshot is requirements.lock.txt.
# 実行時依存の緩い指定。検証済みスナップショットは requirements.lock.txt。
# blosc2 >= 4.4.1: 4.3.3 and earlier write an unreadable node when a bundle's
# point arrays (kp, dp, ka, up, ke) are all empty; see check.py.
# blosc2 4.3.3 以前は点配列 (kp, dp, ka, up, ke) がすべて空のバンドルで読めない
# ノードを書き込むため 4.4.1 以上を要求する（check.py 参照）。
dependencies = [
    "blosc2>=4.4.1",
    "gwyfile",
    "lmfit",
    "matplotlib>=3.10",
    "numpy",
    "opencv-python",
    "pandas",
    "Pillow",
    "scikit-image",
    "scipy",
    # Drops of files onto GUI05 (guis/GUI05_Thumbnail_Viewer.py), checked with
    # 0.7.0. GUI05 turns dropping off when the package or its tkdnd library
    # fails to load, so it is not needed to open the window.
    # GUI05（guis/GUI05_Thumbnail_Viewer.py）へのファイルのドロップに使う。0.7.0
    # で確認した。パッケージや同梱の tkdnd ライブラリを読み込めない場合、GUI05 は
    # ドロップを無効にするだけなので、ウィンドウを開くのには要らない。
    "tkinterdnd2",
    "tksheet",
]

[project.optional-dependencies]
# Babel provides the pybabel CLI used by prepare_translate_catalogs.py and
# catalog compilation; it is a development tool, not a runtime dependency.
# pytest-xdist parallelizes the slow full-size regression tests across CPU
# cores (`pytest -n auto`), which is the main lever for shortening the strict
# regression suite; see [tool.pytest.ini_options] addopts.
# pytest needs the `faulthandler_exit_on_timeout` setting used below; it was
# checked with 9.1.1.
# nbclient and ipykernel run the manual's example notebooks
# (tests/test_manual_notebooks.py).
dev = ["pytest>=9.1", "pytest-xdist", "Babel", "ruff", "nbclient", "ipykernel"]
# Sphinx renders the afm_nanofiber_analyzer/ docstrings into the API reference under docs/.
# Napoleon (NumPy-style parsing) ships with Sphinx; furo is the HTML theme.
# myst-parser renders the Markdown narrative pages (docs/algorithms.md).
docs = ["sphinx", "furo", "myst-parser"]
# gwyconvert runs Gwyddion's file modules for GUI00 / `cli.py convert`
# (afm_nanofiber_analyzer/gwy_convert.py). Optional because prebuilt wheels exist only for
# Windows x86_64, Linux x86_64 and macOS, and because the program is GPL: it is
# installed by the user's own pip, never shipped in the PyInstaller build. The
# upper bound guards the command-line contract afm_nanofiber_analyzer/gwy_convert.py relies on
# (input path, output path, JSON on stdout), which a 0.x release may change.
# gwyconvert は GUI00 / `cli.py convert` で Gwyddion のファイルモジュールを
# 実行する（afm_nanofiber_analyzer/gwy_convert.py）。ビルド済み wheel が Windows x86_64・Linux
# x86_64・macOS にしかなく、また GPL のプログラムなので任意依存とし、利用者自身の
# pip で入れて PyInstaller ビルドには同梱しない。上限は afm_nanofiber_analyzer/gwy_convert.py が
# 頼るコマンドラインの約束（入力パス・出力パス・標準出力の JSON）を守るため。
# 0.x の版では変わりうる。
convert = ["gwyddionpy-converter>=0.1.0,<0.2"]

[project.urls]
Repository = "https://github.com/FibrousBiomaterials/AFM_Nanofiber_Analyzer"

[tool.setuptools]
packages = ["afm_nanofiber_analyzer"]

[tool.pytest.ini_options]
# `afm_nanofiber_analyzer` is collected for the `Examples` sections of its
# docstrings, which --doctest-modules (in addopts) runs, so an example whose
# output the code no longer produces fails here rather than reaching the API
# reference.
testpaths = ["tests", "afm_nanofiber_analyzer"]
# Run tests in parallel across CPU cores via pytest-xdist. This roughly halves
# the wall time of the full suite, whose cost is dominated by the slow
# full-size regression tests (test_integration.py, test_strict_regression.py).
# All tests are isolated (per-test tmp_path / tempdir), so parallel execution
# is output-equivalent to serial. Override with `-n0` for serial runs, e.g.
# when debugging a single test and you want live, ordered output.
addopts = ["-n", "auto", "--doctest-modules"]
# A test still running after this many seconds ends its test process, after
# the stack of every thread is written to the error output. A hung GUI test
# otherwise keeps its windows, and everything else its process holds, until
# someone kills it. The limit covers one test with its setup and teardown;
# pytest drops it once the test has failed, so the teardown of a failed test
# is not covered.
faulthandler_timeout = 600
faulthandler_exit_on_timeout = true
markers = [
    "slow: tests that run the whole pipeline, over a full-size real scan or a generated one",
]

[tool.ruff]
# Skip the local conda environment checked out beside the source tree; .venv
# and other VCS-ignored paths are excluded by Ruff's defaults.
extend-exclude = [".conda-env", ".tmp"]
target-version = "py311"

[tool.ruff.lint]
# Conservative, high-signal rule set: pyflakes (F) catches dead code, unused
# imports, and undefined names; E9 catches syntax errors. Stylistic rules
# (whitespace, line length) and import sorting are intentionally omitted to
# avoid reformat churn in this bilingual-comment codebase. Expand the set
# deliberately if a broader policy is wanted.
select = ["E9", "F"]
